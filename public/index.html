<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary Advances</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb; --accent:#1f5fbf; --ok:#147a3d; --bad:#b42318; --warn:#b54708; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#16213a; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  nav button { background:none; border:0; color:#c9d3e6; font:inherit; padding:6px 10px; cursor:pointer; border-radius:6px; }
  nav button.on { background:#2b3a5c; color:#fff; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tile .k { color:var(--muted); font-size:12px; } .tile .v { font-size:22px; font-weight:600; margin-top:4px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .wrap { overflow-x:auto; }
  button.b { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.p { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.r { color:var(--bad); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  form.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 14px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  label.chk { flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:14px; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:#fff; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eef1f5; }
  .pill.ok { background:#e3f4ea; color:var(--ok); } .pill.bad { background:#fdecea; color:var(--bad); } .pill.warn { background:#fef0e2; color:var(--warn); }
  .checks { list-style:none; padding:0; margin:6px 0; } .checks li { padding:2px 0; }
  .checks .ok::before { content:"✔ "; color:var(--ok); } .checks .bad::before { content:"✘ "; color:var(--bad); }
  .checks .bad { color:var(--bad); }
  .muted { color:var(--muted); } .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#16213a; color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90vw; }
  #toast.err { background:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Salary Advances</h1>
  <nav id="nav">
    <button data-tab="dashboard" class="on">Dashboard</button>
    <button data-tab="requests">Requests</button>
    <button data-tab="advances">Advances</button>
    <button data-tab="employees">Employees</button>
    <button data-tab="settings">Settings &amp; Backup</button>
  </nav>
</header>
<main id="app">Loading…</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
